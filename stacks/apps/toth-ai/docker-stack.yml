services:
  ollama:
    image: ollama/ollama:0.6.6
    environment:
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - toth_ai_internal
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s

  ollama-pull:
    image: ollama/ollama:0.6.6
    env_file:
      - .env
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        MODEL="$${OLLAMA_MODEL:-qwen3:4b-instruct}"
        EXTRA="$${OLLAMA_MODEL_EXTRA:-}"
        EMBED="$${OLLAMA_EMBED_MODEL:-nomic-embed-text}"
        echo "Aguardando Ollama em $${OLLAMA_HOST}..."
        for i in $$(seq 1 90); do
          if ollama list >/dev/null 2>&1; then
            break
          fi
          sleep 2
        done
        ollama list >/dev/null 2>&1 || { echo "Ollama indisponível"; exit 1; }
        echo "A transferir modelo $${MODEL}..."
        ollama pull "$${MODEL}"
        echo "Modelo $${MODEL} pronto."
        if [ -n "$${EXTRA}" ]; then
          echo "A transferir modelo extra $${EXTRA}..."
          ollama pull "$${EXTRA}"
          echo "Modelo $${EXTRA} pronto."
        fi
        echo "A transferir modelo embedding $${EMBED}..."
        ollama pull "$${EMBED}"
        echo "Modelo $${EMBED} pronto."
    networks:
      - toth_ai_internal
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: none

  litellm:
    image: docker.litellm.ai/berriai/litellm:main-stable
    env_file:
      - .env
    volumes:
      - ./config/litellm_config.yaml:/app/config.yaml:ro
    environment:
      HOST: 0.0.0.0
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    networks:
      - toth_ai_internal
      - edge
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')\"",
        ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 45s
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
      labels:
        - traefik.enable=true
        - "traefik.http.routers.toth-ai-litellm.rule=Host(`${TOTH_AI_HOST:?defina TOTH_AI_HOST no .env da stack}`)"
        - traefik.http.routers.toth-ai-litellm.entrypoints=websecure
        - traefik.http.routers.toth-ai-litellm.tls=true
        - traefik.http.routers.toth-ai-litellm.tls.certresolver=letsencrypt
        - traefik.http.services.toth-ai-litellm.loadbalancer.server.port=4000
        - traefik.http.services.toth-ai-litellm.loadbalancer.healthcheck.path=/health/liveliness
        - traefik.http.services.toth-ai-litellm.loadbalancer.healthcheck.interval=20s
        - traefik.http.services.toth-ai-litellm.loadbalancer.healthcheck.timeout=10s

networks:
  edge:
    external: true
    name: infra_edge
  toth_ai_internal:
    driver: overlay
    attachable: true

volumes:
  ollama_data:
