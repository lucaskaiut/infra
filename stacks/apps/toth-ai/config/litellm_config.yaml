model_list:
  # Alias principal (compatível com integrações existentes): respostas diretas, sem bloco de reasoning.
  - model_name: qwen3:4b
    litellm_params:
      model: ollama/qwen3:4b-instruct
      api_base: http://ollama:11434

  # Variante thinking explícita, quando quiser raciocínio separado (mais lento).
  - model_name: qwen3:4b-thinking
    litellm_params:
      model: ollama/qwen3:4b
      api_base: http://ollama:11434

  # Embeddings (768 dims); endpoint OpenAI-compatible: POST /v1/embeddings
  - model_name: nomic-embed-text
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://ollama:11434

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
  set_verbose: false
