name: infra-app-build-runner

services:
  app:
    image: local/build-runner-api:latest
    build:
      context: .
      dockerfile: image/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CONTAINER_ROLE: web
    networks:
      - edge
      - shared_data
    volumes:
      - build_runner_storage:/var/www/html/storage
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    labels:
      - traefik.enable=true
      - traefik.http.routers.build-runner-api.rule=Host(`runner.${DOMAIN:?defina DOMAIN no .env da stack}`)
      - traefik.http.routers.build-runner-api.entrypoints=websecure
      - traefik.http.routers.build-runner-api.tls=true
      - traefik.http.routers.build-runner-api.tls.certresolver=letsencrypt
      - traefik.http.services.build-runner-api.loadbalancer.server.port=80
      - traefik.http.services.build-runner-api.loadbalancer.healthcheck.path=/up
      - traefik.http.services.build-runner-api.loadbalancer.healthcheck.interval=5s
      - traefik.http.services.build-runner-api.loadbalancer.healthcheck.timeout=4s

  scheduler:
    image: local/build-runner-api:latest
    container_name: infra_build_runner_scheduler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CONTAINER_ROLE: scheduler
    depends_on:
      app:
        condition: service_healthy
    networks:
      - shared_data

networks:
  edge:
    external: true
    name: infra_edge
  shared_data:
    external: true
    name: infra_shared

volumes:
  build_runner_storage:
