name: infra-app-eywa

services:
  app:
    image: local/eywa-api:latest
    build:
      context: .
      dockerfile: image/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CONTAINER_ROLE: web
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  worker:
    image: local/eywa-api:latest
    build:
      context: .
      dockerfile: image/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CONTAINER_ROLE: worker

  scheduler:
    image: local/eywa-api:latest
    build:
      context: .
      dockerfile: image/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CONTAINER_ROLE: scheduler

  reverb:
    image: local/eywa-api:latest
    build:
      context: .
      dockerfile: image/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CONTAINER_ROLE: reverb
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
