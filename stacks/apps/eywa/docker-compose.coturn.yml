# TURN (coturn) da videochamada WebRTC do EYWA.
# Roda fora do Swarm (Compose) porque o TURN precisa de portas UDP
# publicadas e de um endereço de relay alcançável pelo navegador.
#   docker compose -f docker-compose.coturn.yml up -d
name: infra-eywa-coturn

services:
  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: infra_eywa_coturn
    restart: unless-stopped
    env_file:
      - .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        exec turnserver -n --log-file=stdout --fingerprint
        --use-auth-secret
        --static-auth-secret="$${TURN_SECRET:?defina TURN_SECRET no .env}"
        --realm="$${TURN_REALM:-eywa}"
        --listening-port=3478 --min-port=49160 --max-port=49200
        --no-cli --no-multicast-peers
        --external-ip="$${TURN_EXTERNAL_IP:?defina TURN_EXTERNAL_IP no .env}"
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
