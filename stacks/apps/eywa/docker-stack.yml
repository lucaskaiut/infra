services:
  app:
    image: local/eywa-api:latest
    env_file:
      - .env
    environment:
      CONTAINER_ROLE: web
      REVERB_HOST: eywa-reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    networks:
      - edge
      - shared_data
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    deploy:
      mode: replicated
      replicas: 2
      update_config:
        order: start-first
        parallelism: 1
        delay: 15s
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 5s
      labels:
        - traefik.enable=true
        - "traefik.http.routers.eywa-api.rule=Host(`eywa-api.${DOMAIN:?defina DOMAIN no .env da stack}`)"
        - traefik.http.routers.eywa-api.entrypoints=websecure
        - traefik.http.routers.eywa-api.tls=true
        - traefik.http.routers.eywa-api.tls.certresolver=letsencrypt
        - traefik.http.services.eywa-api.loadbalancer.server.port=80
        - traefik.http.services.eywa-api.loadbalancer.healthcheck.path=/up
        - traefik.http.services.eywa-api.loadbalancer.healthcheck.interval=5s
        - traefik.http.services.eywa-api.loadbalancer.healthcheck.timeout=4s

  worker:
    image: local/eywa-api:latest
    env_file:
      - .env
    environment:
      CONTAINER_ROLE: worker
      REVERB_HOST: eywa-reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    networks:
      - shared_data
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      placement:
        constraints:
          - node.role == manager

  scheduler:
    image: local/eywa-api:latest
    env_file:
      - .env
    environment:
      CONTAINER_ROLE: scheduler
      REVERB_HOST: eywa-reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    networks:
      - shared_data
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
      placement:
        constraints:
          - node.role == manager

  eywa-reverb:
    image: local/eywa-api:latest
    env_file:
      - .env
    environment:
      CONTAINER_ROLE: reverb
      REVERB_HOST: eywa-api.noxtecnologias.com.br
      REVERB_SCHEME: https
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    networks:
      - edge
      - shared_data
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - "traefik.http.routers.eywa-reverb.rule=Host(`eywa-api.${DOMAIN:?defina DOMAIN no .env da stack}`) && PathPrefix(`/app`)"
        - traefik.http.routers.eywa-reverb.entrypoints=websecure
        - traefik.http.routers.eywa-reverb.tls=true
        - traefik.http.routers.eywa-reverb.tls.certresolver=letsencrypt
        - traefik.http.services.eywa-reverb.loadbalancer.server.port=8080

networks:
  edge:
    external: true
    name: infra_edge
  shared_data:
    external: true
    name: infra_shared
